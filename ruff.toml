target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "proto/gen",
  "target",
]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
