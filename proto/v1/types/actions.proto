syntax = "proto3";

package ocp.v1.types;

message ActionRequest {
  string action_id = 1;
  string type = 2;
  string target = 3;
  map<string, string> parameters = 4;
}

enum ApprovalOutcome {
  APPROVAL_OUTCOME_UNSPECIFIED = 0;
  APPROVAL_OUTCOME_GRANTED = 1;
  APPROVAL_OUTCOME_DENIED = 2;
  APPROVAL_OUTCOME_EXPIRED = 3;
}
