syntax = "proto3";

package ocp.types;

import "ocp/types/actions.proto";
import "ocp/types/channels.proto";

message ActionExecuted {
  ActionRequest action = 1;
  string result = 2;
  repeated ArtifactRef artifacts = 3;
}

message ActionFailed {
  ActionRequest action = 1;
  string error_code = 2;
  string error_message = 3;
  bool retryable = 4;
}
