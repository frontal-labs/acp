syntax = "proto3";

package ocp.types;

import "ocp/types/actors.proto";

message HandoffInitiated {
  string handoff_id = 1;
  ActorRef from = 2;
  ActorRef to = 3;
  string reason = 4;
  repeated string open_questions = 5;
}

message HandoffCompleted {
  string handoff_id = 1;
  ActorRef completed_by = 2;
  string outcome = 3;
}
