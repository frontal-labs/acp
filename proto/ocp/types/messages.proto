syntax = "proto3";

package ocp.types;

import "ocp/types/channels.proto";

message MessageReceived {
  string text = 1;
  repeated ArtifactRef attachments = 2;
  map<string, string> metadata = 3;
}

message MessageSent {
  string text = 1;
  repeated ArtifactRef attachments = 2;
  map<string, string> metadata = 3;
}
